name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    OPEN_API_GENERATOR_VERSION: 'v7.16.0'
    PYTHON_VERSION_DEFAULT: '3.12'
    POETRY_VERSION: '2.2.1'
    THIS_VERSION: $(echo "${{ github.ref_name }}" | cut -d 'v' -f2)

jobs:
    generate-library-code:
        name: Generate Library Code ${{ matrix.language }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                language: ['go', 'java-webclient', 'python', 'typescript']
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Create Output Directory
              run: mkdir out/${{ matrix.language }}

            - name: Run OpenAPI Generator
              uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_PAT }}
                  image: openapitools/openapi-generator-cli:${{ env.OPEN_API_GENERATOR_VERSION }}
                  options: -v ${{ github.workspace }}:/local
                  run: /usr/local/bin/docker-entrypoint.sh batch --clean /local/${{ matrix.language }}.yaml

            - name: Copy LICENSE and our scripts across too
              run: cp LICENSE *.sh ./out/${{ matrix.language }}
            
            - name: Save to Cache
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: out/${{ matrix.language }}
                  key: '${{ matrix.language }}-${{ github.sha }}'

    release-go:
        name: Release Go Library
        runs-on: ubuntu-latest
        needs: generate-library-code

        steps:
            - name: Checkout Generator Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Checkout Go Library Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: sonatype-nexus-community/nexus-repo-api-client-go
                  ref: main
                  token: ${{ secrets.GO_LIB_GH_ACTION_TOKEN }}
                  path: out/go

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # @v7.0.0
              with:
                  go-version-file: 'out/go/go.mod'

            - name: Compute and Validate Go Module Tag
              id: go_tag
              run: |
                  GENERATION=$(grep -Ev '^#|^$' .generation | tail -1 | tr -d '[:space:]')
                  PACKAGE_NAME=$(grep -oP 'packageName:\s*v\K[0-9]+' go.yaml)

                  if [ "${GENERATION}" != "${PACKAGE_NAME}" ]; then
                      echo "::error::.generation (${GENERATION}) does not match go.yaml packageName (v${PACKAGE_NAME}) - keep these in sync before releasing"
                      exit 1
                  fi

                  NXRM_MINOR=$(echo "${{ env.THIS_VERSION }}" | cut -d '.' -f2)
                  NXRM_PATCH=$(echo "${{ env.THIS_VERSION }}" | cut -d '.' -f3)
                  GO_TAG="v${GENERATION}.${NXRM_MINOR}.${NXRM_PATCH}"

                  echo "Computed Go module tag ${GO_TAG} from NXRM version ${{ env.THIS_VERSION }} and generation ${GENERATION}"
                  echo "tag=${GO_TAG}" >> "$GITHUB_OUTPUT"
                  echo "generation=${GENERATION}" >> "$GITHUB_OUTPUT"

            - name: Setup git config
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "<>"

            - name: Unstage all existing files
              run: git rm -fr --ignore-unmatch *
              working-directory: out/go

            - name: Validate Checked Out Library
              run: ls -lR ${{ github.workspace }}

            - name: Get generated code from cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: out/go
                  key: 'go-${{ github.sha }}'
                  fail-on-cache-miss: true

            - name: Validate Checked Out Library
              run: ls -lR ${{ github.workspace }}
              
            - name: Build Go API Client
              run: go build -v ./
              working-directory: out/go

            - name: Install test dependencies & run generated tests
              run: |
                  go get github.com/stretchr/testify/assert
                  go test -v ./test/
              working-directory: out/go

            - name: Inject durable Go module notices (retract, versioning note)
              if: ${{ github.ref_type == 'tag' }}
              run: |
                  {
                      echo ""
                      grep -Ev '^#|^$' .go-retractions | sed -E 's/^([^ ]+)[[:space:]]*#[[:space:]]*(.*)$/retract \1 \/\/ \2/'
                  } >> out/go/go.mod

                  NOTICE_FILE=$(mktemp)
                  cat > "${NOTICE_FILE}" << EOF

                  ## Version Generation Notice

                  This client's Go module major version (\`/v${{ steps.go_tag.outputs.generation }}\` in the import
                  path) does not track NXRM's own version number one-to-one. See the ["Go module versioning is
                  special-cased"](https://github.com/sonatype-nexus-community/nexus-repo-api-client#go-module-versioning-is-special-cased)
                  section of the generator repository's README for the full rationale and scheme, and this module's
                  \`retract\` directives in \`go.mod\` for versions that must not be depended on.
                  EOF

                  TMP=$(mktemp)
                  { head -1 out/go/README.md; cat "${NOTICE_FILE}"; tail -n +2 out/go/README.md; } > "${TMP}"
                  mv "${TMP}" out/go/README.md

            - name: Commit, Tag and Push
              if: ${{ github.ref_type == 'tag' }}
              run: |
                  echo "BRANCH=${{ github.ref }}\nSHA=${{ github.sha }}" > GIT_VERSION
                  git add *
                  git commit -m "Automated Release ${{ steps.go_tag.outputs.tag }} (generated from NXRM v${{ env.THIS_VERSION }})"
                  git tag -a "${{ steps.go_tag.outputs.tag }}" -m "Automated Release ${{ steps.go_tag.outputs.tag }} (generated from NXRM v${{ env.THIS_VERSION }})"
                  git push
                  git push --tags
              working-directory: out/go

    release-python:
      name: Release Python Library
      runs-on: ubuntu-latest
      needs: generate-library-code

      steps:
        - name: Set up Python
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

        - name: Install poetry
          uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec # v9
          with:
            poetry-version: ${{ env.POETRY_VERSION }}

        - name: Get generated code from cache
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
            path: out/python
            key: 'python-${{ github.sha }}'
            fail-on-cache-miss: true

        - name: Set Version
          run: |
            poetry version ${{ env.THIS_VERSION }}
          working-directory: out/python

        - name: Build Python API Client
          run: poetry build
          working-directory: out/python

        - name: Publish
          run: |
            poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
            poetry publish
          working-directory: out/python

    release-java-webclient:
        name: Release Java Webclient Library
        runs-on: ubuntu-latest
        needs: generate-library-code

        steps:
          - name: Set Java JDK 17 and Maven Central Repository
            uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
            with:
              java-version: '17'
              distribution: 'temurin'
              server-id: central
              server-username: MAVEN_USERNAME
              server-password: MAVEN_PASSWORD
              gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
              gpg-passphrase: MAVEN_GPG_PASSPHRASE

          - name: Set up Maven
            uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
            with:
              maven-version: 3.9.4

          - name: Get generated code from cache
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: out/java-webclient
              key: 'java-webclient-${{ github.sha }}'
              fail-on-cache-miss: true

          - name: Publish package
            run: |
                ./update-pom.sh pom.xml
                mvn versions:set -DnewVersion=${{ env.THIS_VERSION }}
                mvn deploy --batch-mode -Ppublish-central -Prelease -DskipTests -DskipNexusStagingDeployMojo
            env:
              MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERAME }}
              MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
              MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
            working-directory: out/java-webclient

    release-typescript:
        name: Release Typescript Library
        runs-on: ubuntu-latest
        needs: generate-library-code

        steps:
            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: latest

            - name: Get generated code from cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: out/typescript
                  key: 'typescript-${{ github.sha }}'
                  fail-on-cache-miss: true
                  
            - name: Set Version
              run: |
                  npm version ${{ env.THIS_VERSION }}
              working-directory: out/typescript

            - name: Build Typescript API Client
              run: npm i && npm run build
              working-directory: out/typescript
              
            - name: Publish
              run: |
                  npm set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
                  npm publish --access public
              working-directory: out/typescript
